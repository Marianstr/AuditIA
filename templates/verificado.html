<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuditIA - Verificación de email</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Manrope', 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(160deg, #F5F5F4, #E7E3DD);
        }

        .tarjeta-login {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(28, 25, 23, 0.10);
            padding: 40px 36px;
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        .acento {
            width: 40px;
            height: 3px;
            background: #7A9471;
            border-radius: 2px;
            margin: 10px auto 14px;
        }

        .mensaje {
            font-size: 14px;
            color: #44403C;
            margin: 18px 0 26px;
            line-height: 1.5;
        }

        .error {
            background: #F6EDEA;
            color: #B5533A;
            border: 1px solid #EBDCD6;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
            margin-bottom: 18px;
        }

        .exito {
            background: #EAF3EE;
            color: #10855E;
            border: 1px solid #D6E8DC;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
            margin-bottom: 18px;
        }

        a.entrar {
            display: block;
            width: 100%;
            background: #7A9471;
            color: #fff;
            border: none;
            padding: 13px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            margin-top: 6px;
            text-decoration: none;
            transition: background 0.2s;
        }

        a.entrar:hover {
            background: #6a8261;
        }
    </style>
</head>

<body>
    <div class="tarjeta-login">
        <img src="/static/auditia-logo.png" alt="AuditIA" style="height:40px; width:auto;">
        <div class="acento"></div>

        {% if exito %}
        <div class="exito">Tu email quedó verificado correctamente.</div>
        <p class="mensaje">Ya podés iniciar sesión y empezar a usar AuditIA.</p>
        {% else %}
        <div class="error">Este enlace de verificación no es válido o ya fue usado.</div>
        <p class="mensaje">Si el problema persiste, probá registrarte de nuevo o contactanos.</p>
        {% endif %}

        <a href="/login" class="entrar">Ir a iniciar sesión →</a>
    </div>
</body>

</html>
